spring.application.name=backend
server.port=8081

# Configuración de base de datos PostgreSQL (libreria_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/libreria_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Opcional: si creaste el archivo data.sql con los datos de prueba
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Origenes permitidos para el frontend en React (Vite/CRA por defecto)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
