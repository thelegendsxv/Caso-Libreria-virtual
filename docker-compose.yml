services:
  postgres:
    image: postgres:16
    container_name: libreria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libreria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - libreria-postgres-data:/var/lib/postgresql/data

volumes:
  libreria-postgres-data:
